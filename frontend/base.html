<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayuda a Perritos</title>
    <link rel="stylesheet" href="style.css">
    <!-- Leaflet interactivo -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <header id="top"> 
        <h1>AYUDA A PERRITOS DE LA CALLE</h1>
        <p class="subtitulo">¡Ayúdanos a registrar perritos sin hogar para que alguien pueda ayudarlos! 🐶</p>
    </header>

    <main> 
        <section>
            <h2>REGISTRAR PERRITOS CERCA DE TI</h2>
            <form id="miFormulario" novalidate>
                <!-- FOTO -->
                <label for="foto">Foto del perrito 📷 *</label>
                <input type="file" id="foto" name="foto" accept="image/jpeg, image/png, image/webp" capture="environment" style="display:none">
                <label for="foto" class="custom-file">Seleccionar foto 📸</label>
                <p id="nombreArchivoFoto" style="text-align: center; font-size: 0.85em; color: #555;"></p>

                <!-- NOMBRE -->
                <label for="nombre">Nombre 🐾 *</label>
                <input type="text" id="nombre" name="nombre" placeholder="Nombre provisional o apodo" required>

                <!-- RAZA (IDs de la BD) -->
                <label for="raza">Raza 🐕</label>
                <select id="raza" name="raza">
                    <option value="">Seleccione raza de perrito</option>
                    <option value="1">Sin raza definida / criollo</option>
                    <option value="2">Pastor Alemán</option>
                    <option value="3">Chihuahua</option>
                    <option value="4">Poodle</option>
                    <option value="5">Labrador Retriever</option>
                    <option value="6">Golden Retriever</option>
                    <option value="7">Schnauzer</option>
                    <option value="8">Beagle</option>
                    <option value="9">Rottweiler</option>
                    <option value="10">Husky Siberiano</option>
                    <option value="11">Boxer</option>
                    <option value="12">Dálmata</option>
                    <option value="13">Pug</option>
                    <option value="14">Bulldog</option>
                </select>

                <!-- COLOR PRINCIPAL (IDs de la BD) -->
                <label for="colorPrincipal">Color 🐶 *</label>
                <select id="colorPrincipal" name="colorPrincipal" required>
                    <option value="">Color principal</option>
                    <option value="1">Negro</option>
                    <option value="2">Blanco</option>
                    <option value="3">Café</option>
                    <option value="4">Marrón</option>
                    <option value="5">Gris</option>
                    <option value="6">Dorado</option>
                    <option value="7">Crema</option>
                    <option value="8">Beige</option>
                    <option value="9">Canela</option>
                    <option value="10">Atigrado</option>
                    <option value="11">Manchado</option>
                    <option value="12">Rojizo</option>
                </select>

                <!-- COLORES SECUNDARIOS (Máximo 2) -->
                <fieldset>
                    <legend>Colores adicionales (máximo dos)</legend>
                    <label><input type="checkbox" name="colores" value="1"> Negro</label>
                    <label><input type="checkbox" name="colores" value="2"> Blanco</label>
                    <label><input type="checkbox" name="colores" value="3"> Café</label>
                    <label><input type="checkbox" name="colores" value="4"> Marrón</label>
                    <label><input type="checkbox" name="colores" value="5"> Gris</label>
                    <label><input type="checkbox" name="colores" value="6"> Dorado</label>
                    <label><input type="checkbox" name="colores" value="7"> Crema</label>
                    <label><input type="checkbox" name="colores" value="8"> Beige</label>
                    <label><input type="checkbox" name="colores" value="9"> Canela</label>
                    <label><input type="checkbox" name="colores" value="10"> Atigrado</label>
                    <label><input type="checkbox" name="colores" value="11"> Manchado</label>
                    <label><input type="checkbox" name="colores" value="12"> Rojizo</label>
                </fieldset>

                <!-- UBICACIÓN Y MAPA -->
                <fieldset>
                    <legend>Ubicación del perrito *</legend>
                    <button type="button" onclick="obtenerUbicacion()">Usar mi ubicación actual</button>
                    <button type="button" id="toggleMapa" aria-expanded="false">Mostrar mapa para afinar ubicación</button>
                    <p id="ubicacion" aria-live="polite" style="font-size: 0.9em; margin-top: 8px;"></p>
                    <div id="mapContainer" hidden>
                        <div id="map" style="height: 320px; margin-top: 10px;"></div>
                    </div>
                    <input type="hidden" id="latitud" name="latitud">
                    <input type="hidden" id="longitud" name="longitud">
                </fieldset>

                <!-- ENVIAR -->
                <button type="submit" id="btnSubmit">Enviar perrito</button>
                <p id="estadoEnvio" style="text-align: center; font-weight: bold; margin-top: 10px;"></p>
            </form>
        </section>

        <!-- SECCIÓN OBLIGATORIA DEL PDF: MAPA GENERAL Y LISTA CON MINIATURAS -->
        <section id="seccionRegistros" style="max-width: 800px; margin: 30px auto; padding: 10px;">
            <h2>PERRITOS REPORTADOS</h2>
            <div id="mapaGeneral" style="height: 400px; border-radius: 8px; border: 2px solid #ccc; margin-bottom: 20px;"></div>
            
            <h3>Lista de registros</h3>
            <div id="listaPerritos" class="tarjetas-grid">
                <!-- Se inyecta dinámicamente con JS -->
            </div>
        </section>
    </main>

    <nav>
        <ul>
            <li><a href="#top">Registrar perritos</a></li>
            <li><a href="#seccionRegistros">Ver mapa general</a></li>
        </ul>
    </nav>

    <script src="funciones.js"></script>
</body>
</html>
