<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Ayuda a Perritos</title>
         <!-- Conectar CSS -->
         <link rel="stylesheet" href="style.css">
        <!--agregar mapa interactvio-->
         <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
         <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    </head>
    <body>
        <header> 
            <h1>AYUDA A PERRITOS DE LA CALLE</h1>
            <h1.5>¡Ayudanos a registrar perritos sin hogar para que alguien pueda ayudarlos!🐶</h1.5>
        </header>
        </nav>
        <main> 
            <section>
                <h2>REGISTRAR PERRITOS CERCA DE TI</h2>
                <form id="miFormulario" action="#" method="post">
<!-- FOTO-->
                    <label for="foto">Subir foto 📷</label>
                    <input type="file" id="foto" name="foto" accept="image/*" capture="environment" style="display:none"><br><br>
                    <label for="foto" class="custom-file">Subir foto 📸</label>
<!-- NOMBRE-->
                    <label for= "nombre">Nombre 🐾</label>
                    <input type="text" id="nombre" name="nombre">
 <!-- RAZA-->
                    <label for= "raza">Raza 🐕</label>
                    <select id="raza" name="raza">
                        <option value="">Seleccione raza de perrito</option>
                        <option value="Desconocido">Criollo</option>
                        <option value="Pastor Aleman">Pastor aleman</option>
                        <option value="Chihuahua">Chihuahua</option>
                        <option value="Poodle">Poodle</option>
                        <option value="Labrador Retriever">Labrador</option>
                        <option value="Golden Retriever">Golden Retriever</option>
                        <option value="Schnauzer">Schnauzer</option>
                        <option value="Beagle">Beagle</option>
                        <option value="Rottweiler">Rottweiler</option>
                        <option value="Husky Siberiano">Husky</option>
                        <option value="Boxer">Boxer</option>
                        <option value="Dalmata">Dalmata</option>
                        <option value="Pug">Pug</option>
                        <option value="Bulldog">Bulldog</option>
                    </select><br><br>
<!-- COLOR-->
                    <label for= "color">Color 🐶</label>
                    <select id="colorPrincipal" name="color">
                        <option value="">Color principal</option>
                        <option value="Negro">Negro</option>
                        <option value="Blanco">Blanco</option>
                        <option value="Cafe">Cafe</option>
                        <option value="Marrón">Marrón</option>
                        <option value="Gris">Gris</option>
                        <option value="Dorado">Dorado</option>
                        <option value="Crema">Crema</option>
                        <option value="Beige">Beige</option>
                        <option value="Canela">Canela</option>
                        <option value="Atigrado">Atigrado</option>
                        <option value="Manchado">Manchado</option>
                        <option value="Rojizo">Rojizo</option>

                    </select><br><br>
<!-- COLORES SECUNDARIOS-->
                    <fieldset>
                        <legend>Colores adicionales (máximo dos)</legend>
                        <label><input type="checkbox" name="colores" value="Negro"> Negro</label>
                        <label><input type="checkbox" name="colores" value="Blanco"> Blanco</label>
                        <label><input type="checkbox" name="colores" value="Marrón"> Marrón</label>
                        <label><input type="checkbox" name="colores" value="Cafe"> Cafe</label>
                        <label><input type="checkbox" name="colores" value="Dorado"> Dorado</label>
                        <label><input type="checkbox" name="colores" value="Canela"> Canela</label>
                        <label><input type="checkbox" name="colores" value="Beige"> Beige</label>
                        <label><input type="checkbox" name="colores" value="Gris"> Gris</label>
                        <label><input type="checkbox" name="colores" value="Crema"> Crema</label>
                        <label><input type="checkbox" name="colores" value="Rojizo"> Rojizo</label>
                    </fieldset><br>
<!-- FECHA-->

<!-- UBI Y MAPA INTERACTIVO-->
                    <fieldset>
                        <legend>Ubicación del perrito</legend>
                        <button type="button" onclick="obtenerUbicacion()">Usar mi ubicación actual</button>
                        <button type="button" id="toggleMapa" aria-expanded="false" aria-controls="mapContainer">Mostrar mapa para elegir ubicación</button>
                        <p id="ubicacion" aria-live="polite"></p>
                        <div id="mapContainer" hidden>
                            <div id="map" style="height: 320px; margin-top: 10px;"></div>
                        </div>
                        <input type="hidden" id="latitud" name="latitud">
                        <input type="hidden" id="longitud" name="longitud">
                    </fieldset><br>
<!--TERMINAR FORMULARIO-->
                    <button type="submit">Enviar perrito</button>
                </form>
                <script src="funciones.js"></script>
        </main>
        <nav>
            <ul>
                
                <li><a href="#top">Registrar perritos </a></li>
                <li><a href="#">Cerca de ti</a></li>
                <li><a href="#">¿Cómo funciona?</a></li>
                <li><a href="#">Acerca de nosotros</a></li>
                
            </ul>
    </body>
</html>
